name: Tester Release Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.jks

      - name: Build tester release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./gradlew :tester:assembleRelease

      - name: Package Tester Release APK into ZIP
        run: |
          VERSION=$(grep 'versionName\s*=' tester/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | tr -d ' ')
          APK_SRC=$(ls tester/build/outputs/apk/release/*.apk | head -n 1)
          APK_NAME="RedirectGuardTester-v${VERSION}-release.apk"
          ZIP_NAME="RedirectGuardTester-v${VERSION}-release.zip"
          
          mv "$APK_SRC" "tester/build/outputs/apk/release/$APK_NAME"
          zip -j "tester/build/outputs/apk/release/$ZIP_NAME" "tester/build/outputs/apk/release/$APK_NAME"
          rm "tester/build/outputs/apk/release/$APK_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedirectGuardTester-release
          path: tester/build/outputs/apk/release/*.zip

      - name: Attach tester ZIP to latest GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP_PATH=$(ls tester/build/outputs/apk/release/*.zip | head -n 1)
          echo "Looking for latest GitHub Release..."
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)
          
          if [ -n "$LATEST_TAG" ]; then
            echo "Found latest release ($LATEST_TAG). Attaching $ZIP_PATH..."
            gh release upload "$LATEST_TAG" "$ZIP_PATH" --clobber
          else
            echo "No releases found on repository. Skipping release attachment."
          fi

      - name: Clean up Keystore
        if: always()
        run: rm -rf app/keystore
